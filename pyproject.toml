[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipecat-bandwidth"
version = "0.1.0"
description = "Bandwidth Programmable Voice telephony serializer for Pipecat"
readme = "README.md"
license = { text = "BSD-2-Clause" }
authors = [{ name = "Bandwidth", email = "kshah@bandwidth.com" }]
requires-python = ">=3.11"
keywords = [
    "pipecat",
    "bandwidth",
    "voice",
    "telephony",
    "websocket",
    "ai",
    "conversational-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Telephony",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pipecat-ai[websocket]>=1.0.0",
    "loguru>=0.7.0",
    "aiohttp>=3.9.0",
]

[project.urls]
Homepage = "https://github.com/Bandwidth/pipecat-bandwidth"
Repository = "https://github.com/Bandwidth/pipecat-bandwidth"
Issues = "https://github.com/Bandwidth/pipecat-bandwidth/issues"
Changelog = "https://github.com/Bandwidth/pipecat-bandwidth/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_bandwidth"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
